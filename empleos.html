<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolsa de Trabajo | Raíces de Iztacalco</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#9B2C2C" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
</head>
<body data-page="empleos" class="bg-papel text-tinta font-sans min-h-screen flex flex-col">
  <div id="shared-header"></div>
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-6 space-y-6 pb-24 lg:pb-16">
    <div class="flex flex-wrap items-center justify-between gap-4 bg-stone-900 border-2 border-amber-300 text-stone-100 p-5 sm:p-6 rounded-2xl shadow-md">
      <div>
        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-white">💼 Bolsa de Trabajo «A 15 Minutos de Casa»</h2>
        <p class="text-xs sm:text-sm text-stone-300 font-medium mt-1">Vacantes en comercios locales para trabajar sin cruzar la ciudad.</p>
      </div>
      <a href="anunciate.html?tipo=empleo" class="px-5 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-stone-950 font-extrabold text-xs sm:text-sm shrink-0 shadow-lg transition flex items-center gap-2">
        <span>💼 Publicar Vacante ($100)</span>
        <span>→</span>
      </a>
    </div>
    <div id="empleos-box" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
  </main>
  <div id="shared-footer"></div>
  <script>
    window.onDeviceChange = function() {
      window.onPageRender();
    };

    window.onPageRender = function() {
      const box = document.getElementById('empleos-box');
      if (!box) return;

      const dev = getEffectiveDeviceType();
      box.className = dev === 'mobile' ? 'grid grid-cols-1 gap-5' : 'grid grid-cols-1 md:grid-cols-2 gap-5';

      const items = DB.empleos.filter(e => matchesGlobalFilter(e.sector, `${e.puesto} ${e.negocio} ${e.requisitos}`));
      box.innerHTML = items.length > 0 ? items.map(e => `
        <article class="bg-white rounded-2xl border border-borde p-5 flex flex-col justify-between shadow-sm">
          <div class="space-y-2.5">
            <span class="text-xs font-mono font-bold bg-chinampaLight text-chinampa px-2.5 py-0.5 rounded-full">📍 A 15 MIN DE CASA • ${sanitizeHTML(e.sector)}</span>
            ${e.foto ? `<div class="cursor-pointer overflow-hidden rounded-xl border border-borde my-2" onclick="openPhotoLightboxEncoded('${encodeDataParam(e.foto)}', '${encodeDataParam(e.puesto)}')"><img src="${sanitizeHTML(e.foto)}" alt="${sanitizeHTML(e.puesto)}" loading="lazy" decoding="async" class="w-full h-44 object-cover" /></div>` : ''}
            <h3 class="font-serif font-bold text-lg text-stone-900">${sanitizeHTML(e.puesto)}</h3>
            <p class="text-xs sm:text-sm font-bold text-terracota">🏪 ${sanitizeHTML(e.negocio)}</p>
            <p class="text-xs sm:text-sm font-mono font-bold text-chinampa">💰 ${sanitizeHTML(e.sueldo || 'Sueldo e informes en entrevista')}</p>
            <p class="text-xs sm:text-sm text-stone-700 font-medium bg-papel p-3 rounded-xl border border-borde leading-relaxed">${sanitizeHTML(e.requisitos)}</p>
          </div>
          <button type="button" onclick="openWhatsAppDirectEncoded('${sanitizeHTML(e.whatsapp)}', '${encodeDataParam('Hola, me interesa la vacante de *' + e.puesto + '* publicada en Raíces de Iztacalco:')}')" class="mt-4 w-full py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-bold text-xs sm:text-sm transition">
            📲 Postularme por WhatsApp
          </button>
        </article>
      `).join('') : renderEmptyState({
        icon: '💼',
        title: 'No hay vacantes registradas con este filtro',
        ctaHref: 'anunciate.html?tipo=empleo',
        ctaLabel: '💼 Publicar Vacante ($100)'
      });
    };
    document.addEventListener('DOMContentLoaded', () => { renderSharedLayout('empleos'); window.onPageRender(); });
  </script>
</body>
</html>
