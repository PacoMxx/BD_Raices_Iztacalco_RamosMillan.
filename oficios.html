<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Oficio Verificado | Raíces de Iztacalco</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#9B2C2C" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
</head>
<body data-page="oficios" class="bg-papel text-tinta font-sans min-h-screen flex flex-col">
  <div id="shared-header"></div>
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-6 space-y-6 pb-24 lg:pb-16">
    <div class="flex flex-wrap items-center justify-between gap-4 bg-stone-900 border-2 border-green-600 text-stone-100 p-5 sm:p-6 rounded-2xl shadow-md">
      <div>
        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-white">🛠️ El Oficio Verificado (Emergencias en Casa)</h2>
        <p class="text-xs sm:text-sm text-stone-300 font-medium mt-1">Plomeros, cerrajeros y electricistas recomendados por vecinos de la colonia ($50 MXN por anunciar).</p>
      </div>
      <a href="anunciate.html?tipo=oficio" class="px-5 py-3 rounded-xl bg-chinampa hover:bg-green-700 text-white font-extrabold text-xs sm:text-sm shrink-0 shadow-lg transition flex items-center gap-2">
        <span>🛠️ Anunciar mi Oficio ($50)</span>
        <span>→</span>
      </a>
    </div>
    <div id="oficios-box" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>
  <div id="shared-footer"></div>
  <script>
    window.onDeviceChange = function() {
      window.onPageRender();
    };

    window.onPageRender = function() {
      const box = document.getElementById('oficios-box');
      if (!box) return;

      const dev = getEffectiveDeviceType();
      if (dev === 'mobile') {
        box.className = 'grid grid-cols-1 gap-5';
      } else if (dev === 'tablet') {
        box.className = 'grid grid-cols-2 gap-5';
      } else {
        box.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5';
      }

      const items = DB.oficios.filter(o => matchesGlobalFilter(o.sector, `${o.oficio} ${o.nombre || ''} ${o.calle} ${o.garantia}`));
      box.innerHTML = items.length > 0 ? items.map(o => `
        <article class="bg-white rounded-2xl border border-borde p-5 flex flex-col justify-between shadow-sm">
          <div class="space-y-2.5">
            <div class="flex justify-between text-xs font-mono">
              <span class="bg-amber-100 text-amber-900 px-2.5 py-0.5 rounded font-bold">✓ OFICIO VERIFICADO</span>
              <span class="text-stone-700 font-bold">📍 ${sanitizeHTML(o.sector)}</span>
            </div>
            ${o.foto ? `<div class="cursor-pointer overflow-hidden rounded-xl border border-borde my-2" onclick="openPhotoLightboxEncoded('${encodeDataParam(o.foto)}', '${encodeDataParam(o.oficio)}')"><img src="${sanitizeHTML(o.foto)}" alt="${sanitizeHTML(o.oficio)}" loading="lazy" decoding="async" class="w-full h-44 object-cover" /></div>` : ''}
            <h3 class="font-serif font-bold text-lg text-stone-900">${sanitizeHTML(o.oficio)}</h3>
            ${o.nombre ? `<p class="text-xs sm:text-sm font-bold text-terracota">👤 ${sanitizeHTML(o.nombre)}</p>` : ''}
            <p class="text-xs sm:text-sm text-stone-700 font-medium">📍 ${sanitizeHTML(o.calle)}</p>
            <p class="text-xs sm:text-sm text-stone-700 font-medium bg-papel p-3 rounded-xl border border-borde leading-relaxed">${sanitizeHTML(o.garantia)}</p>
          </div>
          <button type="button" onclick="openWhatsAppDirectEncoded('${sanitizeHTML(o.whatsapp)}', '${encodeDataParam('Hola, vi su contacto de ' + o.oficio + ' en Raíces de Iztacalco y requiero una cotización:')}')" class="mt-4 w-full py-2.5 rounded-xl bg-chinampa hover:bg-green-800 text-white font-bold text-xs sm:text-sm transition">
            📲 Solicitar servicio por WhatsApp
          </button>
        </article>
      `).join('') : renderEmptyState({
        icon: '🛠️',
        title: 'No encontramos oficios con este filtro',
        ctaHref: 'anunciate.html?tipo=oficio',
        ctaLabel: '🛠️ Registrar mi Oficio ($50)'
      });
    };
    document.addEventListener('DOMContentLoaded', () => { renderSharedLayout('oficios'); window.onPageRender(); });
  </script>
</body>
</html>
