<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicar y Subir Anuncios | Raíces de Iztacalco</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
  <style>
    .hp-trap { opacity: 0; position: absolute; top: 0; left: 0; height: 0; width: 0; z-index: -1; pointer-events: none; }
  </style>
</head>
<body data-page="anunciate" class="bg-papel text-tinta font-sans min-h-screen flex flex-col">

  <div id="shared-header"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 space-y-8 pb-20">

    <div class="bg-white rounded-2xl border border-borde p-6 shadow-sm space-y-4">
      <div class="text-center max-w-2xl mx-auto">
        <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-900 font-mono text-xs font-bold">
          ✨ CENTRO DE PUBLICACIÓN VECINAL Y COMERCIAL
        </span>
        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-tinta mt-2">
          ¿Qué deseas publicar hoy en Raíces de Iztacalco?
        </h2>
        <p class="text-xs sm:text-sm text-grafito mt-1">
          Elige la sección en la que deseas aparecer:
        </p>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 pt-2">
        <button type="button" onclick="setFormCategory('NOTICIA')" data-cat-btn="NOTICIA" class="cat-selector-btn p-2.5 rounded-xl border-2 text-center transition flex flex-col items-center gap-1">
          <span class="text-xl">🗞️</span>
          <span class="text-[11px] font-extrabold leading-tight">Noticia</span>
          <span class="text-[9px] font-mono text-terracota font-bold">Gratis</span>
        </button>

        <button type="button" onclick="setFormCategory('FOTO_HISTORIA')" data-cat-btn="FOTO_HISTORIA" class="cat-selector-btn p-2.5 rounded-xl border-2 text-center transition flex flex-col items-center gap-1">
          <span class="text-xl">📷</span>
          <span class="text-[11px] font-extrabold leading-tight">Foto Antigua</span>
          <span class="text-[9px] font-mono text-chinampa font-bold">Gratis</span>
        </button>

        <button type="button" onclick="setFormCategory('MASCOTA')" data-cat-btn="MASCOTA" class="cat-selector-btn p-2.5 rounded-xl border-2 text-center transition flex flex-col items-center gap-1">
          <span class="text-xl">🐾</span>
          <span class="text-[11px] font-extrabold leading-tight">Mascota</span>
          <span class="text-[9px] font-mono text-chinampa font-bold">Gratis / $50</span>
        </button>

        <button type="button" onclick="setFormCategory('TIANGUIS')" data-cat-btn="TIANGUIS" class="cat-selector-btn p-2.5 rounded-xl border-2 text-center transition flex flex-col items-center gap-1">
          <span class="text-xl">🛍️</span>
          <span class="text-[11px] font-extrabold leading-tight">Tianguis</span>
          <span class="text-[9px] font-mono text-grafito font-bold">Gratis / $39</span>
        </button>

        <button type="button" onclick="setFormCategory('EMPLEO')" data-cat-btn="EMPLEO" class="cat-selector-btn p-2.5 rounded-xl border-2 text-center transition flex flex-col items-center gap-1">
          <span class="text-xl">💼</span>
          <span class="text-[11px] font-extrabold leading-tight">Empleo</span>
          <span class="text-[9px] font-mono text-grafito font-bold">$100 / 15d</span>
        </button>

        <button type="button" onclick="setFormCategory('NEGOCIO')" data-cat-btn="NEGOCIO" class="cat-selector-btn p-2.5 rounded-xl border-2 text-center transition flex flex-col items-center gap-1">
          <span class="text-xl">🏪</span>
          <span class="text-[11px] font-extrabold leading-tight">Negocio</span>
          <span class="text-[9px] font-mono text-terracota font-bold">Pro $199</span>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border-2 border-terracota/25 p-6 sm:p-8 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-6 border-b border-borde">
        <div>
          <span id="form-badge" class="text-[11px] font-mono uppercase font-bold text-terracota">SECCIÓN</span>
          <h3 id="form-heading" class="font-serif text-xl sm:text-2xl font-bold text-tinta">Formulario</h3>
        </div>
        <span class="text-[11px] font-mono bg-green-50 text-chinampa border border-green-200 px-2.5 py-1 rounded-md font-bold">
          🛡️ Candado de Seguridad Activo
        </span>
      </div>

      <form id="dynamic-form" onsubmit="submitDynamicForm(event)" class="space-y-5 relative">
        <div class="hp-trap" aria-hidden="true">
          <input type="text" id="website_url_trap" tabindex="-1" autocomplete="off" />
        </div>

        <div id="dynamic-fields-container" class="space-y-4"></div>

        <div id="photo-upload-section" class="p-4 rounded-2xl bg-papel border-2 border-dashed border-stone-300 hover:border-terracota transition space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <label id="photo-label" class="block text-xs font-bold uppercase font-mono text-tinta">
                📸 Fotografía
              </label>
              <p class="text-[11px] text-grafito">Formatos JPG o PNG optimizados.</p>
            </div>
            <label class="cursor-pointer inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-tinta text-white font-bold text-xs shrink-0">
              <span>📁 Elegir Foto</span>
              <input id="f-photo-input" type="file" accept="image/*" onchange="handlePhotoPreview(event)" class="hidden" />
            </label>
          </div>

          <div id="photo-preview-box" class="hidden pt-2 flex items-center gap-4">
            <img id="photo-preview-img" src="" alt="Vista previa" class="w-24 h-24 object-cover rounded-xl border border-borde shadow-sm" />
            <div class="text-xs space-y-1">
              <p class="font-bold text-chinampa">✓ Fotografía lista</p>
              <button type="button" onclick="clearSelectedPhoto()" class="text-red-700 font-bold hover:underline">✕ Quitar foto</button>
            </div>
          </div>
        </div>

        <!-- Botón universal de envío con colores de alto contraste visibles en cualquier pantalla -->
        <div class="pt-4">
          <button id="btn-submit-dynamic" type="submit" class="w-full py-4 rounded-xl bg-stone-900 hover:bg-stone-800 text-amber-300 border-2 border-amber-400 font-extrabold text-base shadow-xl transition flex items-center justify-center gap-2">
            <span>✅ Terminar y Enviar Publicación</span>
            <span>→</span>
          </button>
        </div>
      </form>

      <div id="result-box" class="hidden mt-6 p-5 rounded-xl bg-chinampaLight border-2 border-chinampa text-chinampa text-xs sm:text-sm space-y-3"></div>
    </div>

  </main>

  <div id="shared-footer"></div>

    function setFormCategory(catKey) {
      currentCat = catKey;
      const cfg = CONFIG_CATEGORIAS[catKey] || CONFIG_CATEGORIAS.NOTICIA;
      document.querySelectorAll('.cat-selector-btn').forEach(btn => {
        const active = btn.getAttribute('data-cat-btn') === catKey;
        btn.className = active
          ? 'cat-selector-btn p-2.5 rounded-xl border-2 border-terracota bg-amber-50 text-terracota text-center transition flex flex-col items-center gap-1 shadow-sm'
          : 'cat-selector-btn p-2.5 rounded-xl border-2 border-borde bg-papel hover:border-stone-400 text-tinta text-center transition flex flex-col items-center gap-1';
      });
      document.getElementById('form-badge').textContent = cfg.badge;
      document.getElementById('form-heading').textContent = cfg.heading;
      document.getElementById('photo-label').textContent = cfg.photoLabel;
      document.getElementById('btn-submit-dynamic').textContent = cfg.btnText;
      document.getElementById('dynamic-fields-container').innerHTML = cfg.renderFields();
      document.getElementById('result-box').classList.add('hidden');
    }

    function handlePhotoPreview(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 360;
          const scale = Math.min(1, MAX_WIDTH / img.width);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          compressedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.55);
          document.getElementById('photo-preview-img').src = compressedPhotoBase64;
          document.getElementById('photo-preview-box').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearSelectedPhoto() {
      compressedPhotoBase64 = '';
      document.getElementById('f-photo-input').value = '';
      document.getElementById('photo-preview-box').classList.add('hidden');
    }

    async function submitDynamicForm(e) {
      e.preventDefault();
      if (document.getElementById('website_url_trap').value.trim() !== '') return;

      const cfg = CONFIG_CATEGORIAS[currentCat];
      if (cfg.photoRequired && !compressedPhotoBase64) {
        alert('Por favor selecciona y adjunta la fotografía requerida.');
        return;
      }

      const modalidadVal = document.getElementById('f-modalidad') ? document.getElementById('f-modalidad').value : 'Gratis';
      const isBoost = modalidadVal.includes('Boost');
      const isTianguisDestacado = modalidadVal.includes('Destacado');
      const isVacante = modalidadVal.includes('Vacante');
      const isPro = modalidadVal.includes('Pro');

      let mpPlan = null;
      if (isPro) mpPlan = MP_LINKS.SUSCRIPCION_PRO_199;
      else if (isTianguisDestacado) mpPlan = MP_LINKS.TIANGUIS_39;
      else if (isVacante) mpPlan = MP_LINKS.VACANTE_100;
      else if (isBoost) mpPlan = MP_LINKS.BOOST_50;

      const payload = {
        website_url_trap: '',
        categoria: currentCat,
        modalidad: modalidadVal,
        sector: document.getElementById('f-sector').value,
        titulo: document.getElementById('f-titulo').value,
        subdato: document.getElementById('f-subdato').value,
        detalles: document.getElementById('f-detalles').value,
        whatsapp: document.getElementById('f-wa') ? document.getElementById('f-wa').value : '',
        foto: compressedPhotoBase64 || ''
      };

      const resBox = document.getElementById('result-box');
      resBox.classList.remove('hidden');

      if (mpPlan) {
        resBox.innerHTML = `
          <p class="font-bold text-sm text-sky-900">💳 CANDADO DE PAGO OBLIGATORIO:</p>
          <p class="text-xs">Para registrar tu publicación <strong>"${payload.titulo}"</strong>, primero debes completar tu pago seguro de <strong>${mpPlan.amount}</strong> en Mercado Pago.</p>
          <div class="mt-3 flex flex-wrap gap-2">
            <a href="${mpPlan.url}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs">
              Pagar ${mpPlan.amount} en Mercado Pago ↗
            </a>
            <button type="button" onclick='enviarRegistroPostPago(${JSON.stringify(payload)})' class="px-4 py-2 rounded-lg bg-chinampa text-white font-bold text-xs">
              Ya pagué, enviar registro a revisión ✓
            </button>
          </div>
        `;
        return;
      }

      const btn = document.getElementById('btn-submit-dynamic');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      if (GOOGLE_SHEETS_WEBAPP_URL) {
        try {
          await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (err) {}
      }

      btn.disabled = false;
      btn.textContent = cfg.btnText;
      resBox.innerHTML = `
        <p class="font-bold text-sm">✅ ¡Enviado con éxito!</p>
        <p class="text-xs mt-1">Tu publicación ha entrado a revisión. En cuanto el administrador la apruebe en Google Sheets, aparecerá visible en la página web.</p>
      `;
      e.target.reset();
      clearSelectedPhoto();
    }

    async function enviarRegistroPostPago(payloadObj) {
      const resBox = document.getElementById('result-box');
      resBox.innerHTML = `<p class="text-xs font-bold">Enviando registro confirmado...</p>`;
      if (GOOGLE_SHEETS_WEBAPP_URL) {
        try {
          await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadObj)
          });
        } catch (err) {}
      }
      resBox.innerHTML = `
        <p class="font-bold text-sm">✅ ¡Pago confirmado y registro enviado!</p>
        <p class="text-xs mt-1">En cuanto el administrador valide tu comprobante en Google Sheets y apruebe el post, se publicará en la página web.</p>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSharedLayout('anunciate');
      const params = new URLSearchParams(window.location.search);
      const tipo = params.get('tipo');
      if (tipo === 'noticia') setFormCategory('NOTICIA');
      else if (tipo === 'foto') setFormCategory('FOTO_HISTORIA');
      else if (tipo === 'mascota') setFormCategory('MASCOTA');
      else if (tipo === 'tianguis') setFormCategory('TIANGUIS');
      else if (tipo === 'empleo') setFormCategory('EMPLEO');
      else if (tipo === 'negocio') setFormCategory('NEGOCIO');
      else setFormCategory('NOTICIA');
    });
  </script>
</body>
</html>
