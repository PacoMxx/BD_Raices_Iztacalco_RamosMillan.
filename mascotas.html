<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar de Mascotas | Raíces de Iztacalco</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
</head>
<body data-page="mascotas" class="bg-papel text-tinta font-sans min-h-screen flex flex-col">
  <div id="shared-header"></div>
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6 pb-20">
    <!-- Encabezado con texto de contraste legible y botón de publicación destacado -->
    <div class="flex flex-wrap items-center justify-between gap-4 bg-stone-900 border-2 border-red-600 text-stone-100 p-6 rounded-2xl shadow-md">
      <div>
        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-white">🐾 Radar de Mascotas Perdidas y Adopción</h2>
        <p class="text-xs sm:text-sm text-stone-300 font-medium mt-1">Alertas por cuadra en la Ramos Millán. Reporta gratis o activa tu Boost Urgente.</p>
      </div>
      <a href="anunciate.html?tipo=mascota" class="px-5 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-extrabold text-xs sm:text-sm shrink-0 shadow-lg transition flex items-center gap-2">
        <span>🐾 Publicar Mascota Perdida</span>
        <span>→</span>
      </a>
    </div>
    <div id="mascotas-box" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
  </main>
  <div id="shared-footer"></div>
  <script>
    window.onPageRender = function() {
      document.getElementById('mascotas-box').innerHTML = DB.mascotas
        .filter(m => matchesGlobalFilter(m.sector, `${m.nombre} ${m.calle} ${m.descripcion}`))
        .map(m => `
          <div class="bg-white rounded-2xl border ${m.destacado ? 'border-2 border-red-600 shadow-md' : 'border-borde shadow-sm'} p-5 flex flex-col justify-between">
            <div class="space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[10px] font-mono font-bold px-2.5 py-0.5 rounded-full ${m.destacado ? 'bg-red-600 text-white' : 'bg-amber-100 text-amber-900'}">${m.tipo}</span>
                <span class="text-[11px] font-mono text-stone-700 font-semibold">📍 ${m.sector}</span>
              </div>
              ${m.foto ? `
                <div class="relative group cursor-pointer overflow-hidden rounded-xl border border-borde bg-stone-100" onclick="openPhotoLightbox('${m.foto}', '${m.nombre}')">
                  <img src="${m.foto}" alt="${m.nombre}" class="w-full h-52 object-cover" />
                </div>
              ` : ''}
              <h3 class="font-serif font-bold text-lg text-stone-900">${m.nombre}</h3>
              <p class="text-xs font-bold text-terracota">🗺️ Visto en: ${m.calle}</p>
              <p class="text-xs text-stone-700 font-medium bg-papel p-3 rounded-xl border border-borde leading-relaxed">${m.descripcion}</p>
            </div>
            <button onclick="openWhatsAppDirect('${m.whatsapp}', 'Hola, vi la alerta de tu mascota (*${m.nombre}*):')" class="mt-4 w-full py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs transition">
              📲 Avisar al dueño por WhatsApp
            </button>
          </div>
        `).join('');
    };
    document.addEventListener('DOMContentLoaded', () => { renderSharedLayout('mascotas'); window.onPageRender(); });
  </script>
</body>
</html>
