<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crónicas y Raíces | Raíces de Iztacalco</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
  <style>.sepia-vintage { filter: sepia(0.75) contrast(1.1) brightness(0.92); }</style>
</head>
<body data-page="cronicas" class="bg-papel text-tinta font-sans min-h-screen flex flex-col">
  <div id="shared-header"></div>
  
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-8 pb-20">
    
    <!-- Encabezado con el Botón de Subir Foto Grande y de Alto Contraste -->
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 bg-white rounded-2xl border border-borde p-6 shadow-sm">
      <div>
        <span class="text-xs font-mono font-bold text-terracota bg-red-50 border border-red-200 px-2.5 py-1 rounded-md">
          📷 MEMORIA HISTÓRICA DE NUESTRAS CALLES
        </span>
        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-stone-900 mt-2">Crónicas y Álbum Comunitario</h2>
        <p class="text-xs sm:text-sm text-stone-700 font-medium mt-1">Comparte fotografías antiguas de tu familia o de cómo eran las calles de la Ramos Millán.</p>
      </div>
      
      <!-- Botón mejorado: más grande, color terracota oscuro de alto contraste y letras blancas -->
      <a href="anunciate.html?tipo=foto" class="px-6 py-3.5 rounded-xl bg-terracotaDark hover:bg-stone-900 text-white font-extrabold text-sm shrink-0 shadow-lg transition flex items-center gap-2.5">
        <span class="text-lg">📷</span>
        <span>Subir mi Foto a esta sección</span>
        <span class="text-base">→</span>
      </a>
    </div>

    <div id="cronicas-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </main>

  <div id="shared-footer"></div>

  <script>
    window.onPageRender = function() {
      const list = document.getElementById('cronicas-list');
      const items = DB.cronicas.filter(c => matchesGlobalFilter(c.sector, `${c.titulo} ${c.contenidoCompleto} ${c.autor || ''}`));
      list.innerHTML = items.map(c => `
        <article class="bg-white rounded-2xl border border-borde p-5 shadow-sm flex flex-col justify-between">
          <div class="space-y-3">
            <div class="flex justify-between text-[10px] font-mono font-bold">
              <span class="px-2.5 py-0.5 rounded bg-crema text-terracota">${c.categoria}</span>
              <span class="text-stone-700 font-semibold">📍 ${c.sector}</span>
            </div>
            ${c.foto ? `
              <div class="cursor-pointer overflow-hidden rounded-xl border border-borde bg-stone-100" onclick="openPhotoLightbox('${c.foto}', '${c.titulo}')">
                <img src="${c.foto}" alt="${c.titulo}" class="w-full h-52 object-cover" />
              </div>
            ` : ''}
            <h3 class="font-serif font-bold text-lg text-stone-900 leading-snug">${c.titulo}</h3>
            ${c.autor ? `<p class="text-xs font-bold text-terracota">✍️ Autor: ${c.autor}</p>` : ''}
            <p class="text-xs text-stone-700 font-medium bg-papel p-3 rounded-xl border border-borde leading-relaxed">${c.contenidoCompleto}</p>
          </div>
          <div class="pt-3 mt-4 border-t border-borde flex justify-between items-center text-xs">
            <span class="font-mono text-stone-700 font-semibold">${c.fecha}</span>
            <button onclick="shareOnWhatsApp('Crónica Ramos Millán: ${c.titulo}')" class="font-bold text-chinampa hover:underline">📲 Compartir</button>
          </div>
        </article>
      `).join('');
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderSharedLayout('cronicas');
      window.onPageRender();
    });
  </script>
</body>
</html>
